<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Subway Dash 3D</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-score"><span id="score">0</span></div>
    <div class="hud-coins"><span id="coins">0</span><i class="coin-ico"></i></div>
  </div>
  <div class="hud-mult" id="multiplier"></div>
  <div class="hud-power" id="powerbar"></div>
</div>

<div id="menu" class="overlay">
  <div class="logo">
    <div class="logo-main">SUBWAY<span>DASH</span></div>
    <div class="logo-sub">3D ENDLESS RUNNER</div>
  </div>
  <div class="chars" id="chars"></div>
  <button id="play" class="btn-play">ИГРАТЬ</button>
  <div class="menu-foot">
    <span>свайп ← → ↑ ↓</span>
    <button id="mute" class="btn-ico" title="звук">♪</button>
  </div>
  <div class="best" id="best"></div>
</div>

<div id="over" class="overlay hidden">
  <div class="over-card">
    <div class="over-title">GAME OVER</div>
    <div class="over-stats">
      <div><b id="final-score">0</b><span>счёт</span></div>
      <div><b id="final-coins">0</b><span>монеты</span></div>
      <div><b id="final-best">0</b><span>рекорд</span></div>
    </div>
    <button id="restart" class="btn-play">ЗАНОВО</button>
  </div>
</div>

<div id="rotate" class="hidden">↻ поверни телефон горизонтально</div>
<div id="fps"></div>

<script type="module" src="game.js"></script>
</body>
</html>
